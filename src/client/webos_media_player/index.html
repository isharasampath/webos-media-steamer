<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS Media Player</title>
    <!-- Link to your new external CSS file -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div id="browser-ui">
        <h1>Media Library</h1>
        <div id="status">Connecting to Media Server...</div>
        <div id="media-list" class="media-list"></div>
    </div>

    <div id="player-ui">
        <video id="videoPlayer" crossorigin="anonymous" data-webos-controls="true" media-layer="true">
            <track id="subTrack" kind="subtitles" srclang="si" label="Sinhala" default>
        </video>
    </div>

    <div id="video-overlay" class="overlay hidden">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="time-info">
            <span id="elapsed-time">00:00:00</span>
            <span id="total-time">00:00:00</span>
        </div>
    </div>

    <div class="top-nav-bar">
        <div id="reload-icon" tabindex="102" onclick="fetchMedias()">
            <!-- This is a "Reload" icon drawn with lines -->
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"></path>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
        </div>
        <div id="settings-icon" tabindex="100" onclick="toggleSettings()">⚙️</div>
        <div id="close-icon" tabindex="101" onclick="triggerExit()">✕</div>
    </div>

    <div id="settings-ui">
        <div class="settings-box">
            <div class="close-x" onclick="closeSettingsWithoutSaving()">✕</div>

            <h2>WebOS Media Player Settings</h2>
            <p>Media Server IP Address:</p>
            <input type="text" id="ipInput" placeholder="e.g. 192.168.1.10">
            <br>
            <button class="btn" id="saveBtn">Save & Reload</button>
        </div>
    </div>

    <div id="resume-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Resume Playback?</h2>
            <p id="resume-text">Do you want to continue from where you left off?</p>
            <div class="modal-buttons">
                <button id="btn-resume" class="modal-btn" tabindex="200">Resume</button>
                <button id="btn-restart" class="modal-btn" tabindex="201">Start Over</button>
                <button id="btn-cancel" class="modal-btn" tabindex="202">Cancel</button>
            </div>
        </div>
    </div>

    <script src="assets/scripts/script.js"></script>
</body>

</html>
